# A small two-room flat with a hallway — a starting point to look at or paste into a card.
# You normally don't write this by hand: draw it in the card's editor (pencil button) and save.
# Units: 1 = 1 cm. Replace the entity ids with your own (or delete the lines you don't have).
type: custom:floorplan-card
card_id: fp_example
height: calc(100vh - var(--header-height, 56px))
north: 0
floors:
  - id: floor_home
    name: Home
    rooms:
      - id: room_living
        name: Living room
        area: living_room # lights of this area are used when `lights` is empty
        points: [[0, 0], [520, 0], [520, 420], [0, 420]]
        temperature: sensor.living_room_temperature
        humidity: sensor.living_room_humidity
        climate: climate.living_room
        floor: { type: herringbone, color: "#c99a62" }
      - id: room_bedroom
        name: Bedroom
        area: bedroom
        points: [[520, 0], [880, 0], [880, 420], [520, 420]]
        lights: [light.bedroom_ceiling, light.bedside]
        temperature: sensor.bedroom_temperature
        floor: { type: planks }
      - id: room_hall
        name: Hallway
        points: [[0, 420], [880, 420], [880, 560], [0, 560]]
        floor: { type: tiles, size: 30 }
    openings:
      - { id: door_front, type: door, a: [380, 560], b: [470, 560], entity: binary_sensor.front_door }
      - { id: door_living, type: door, a: [180, 420], b: [270, 420] }
      - { id: door_bedroom, type: door, a: [620, 420], b: [710, 420], hinge_b: true }
      - { id: win_living, type: window, a: [140, 0], b: [380, 0], entity: binary_sensor.living_room_window }
      - { id: win_bedroom, type: window, a: [640, 0], b: [800, 0], entity: binary_sensor.bedroom_window }
    devices:
      - id: dev_tv
        entity: media_player.living_room_tv
        icon: mdi:television
        x: 260
        y: 380
      - id: dev_vacuum
        entity: vacuum.robot
        x: 820
        y: 520
    furniture:
      - { id: sofa, kind: sofa, x: 260, y: 120, w: 220, h: 95, rotation: 180 }
      - { id: lamp, kind: floor_lamp, x: 60, y: 60, w: 40, h: 40, entity: light.living_room_floor_lamp }
      - { id: rug, kind: rug, x: 260, y: 230, w: 200, h: 140 }
      - { id: radiator, kind: radiator, x: 470, y: 12, w: 80, h: 10 }
      - { id: bed, kind: bed, x: 700, y: 210, w: 160, h: 200, rotation: 90 }
      - { id: wardrobe, kind: wardrobe, x: 846, y: 120, w: 160, h: 60, rotation: 270 }
