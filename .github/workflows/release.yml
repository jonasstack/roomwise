# Pushing a tag like v0.1.0-beta.2 builds everything fresh and publishes a GitHub release with:
#   floorplan_card.zip  the contents of custom_components/floorplan_card (manifest.json at the zip's root, the card in
#                       frontend/, the 3D models in frontend/models/) – what HACS installs (hacs.json: zip_release);
#                       the built card is NOT in the repository (.gitignore), only in this zip
#   house_rules.zip     the Hausregeln integration with its panel, for a manual install into custom_components/house_rules
#   floorplan-card.js   the bare card, for people who want it without the integration
# Publishing a release by hand in the GitHub UI works too: the same files are attached to it.
#
# Once both integrations are merged into `roomwise`: build one roomwise.zip from custom_components/roomwise and drop
# house_rules.zip.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            hausregeln/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node tools/tests/i18n.mjs --strict
      - name: Privacy scan
        run: node tools/release/privacy-scan.mjs
        env:
          ROOMWISE_DENYLIST: ${{ secrets.ROOMWISE_DENYLIST }}
      - name: Tag and all versions agree
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          tag="${tag#v}"
          node tools/release/version.mjs
          v=$(node -p "require('./package.json').version")
          echo "tag=$tag version=$v"
          test "$tag" = "$v"
      - name: No placeholders left in the manifests
        run: |
          ! grep -n "OWNER/\|@OWNER\|REPLACE_ME" custom_components/floorplan_card/manifest.json hausregeln/custom_components/house_rules/manifest.json
      - run: npm run build
      - run: node tools/build.mjs --single
      - name: Build the Hausregeln panel
        working-directory: hausregeln
        run: npm ci && npm run build
      - name: Package
        run: |
          (cd custom_components/floorplan_card && zip -qr "$GITHUB_WORKSPACE/floorplan_card.zip" . -x '__pycache__/*' '*.pyc')
          (cd hausregeln/custom_components/house_rules && zip -qr "$GITHUB_WORKSPACE/house_rules.zip" . -x '__pycache__/*' '*.pyc')
          unzip -l floorplan_card.zip | tail -n 3
          unzip -l house_rules.zip | tail -n 3
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            pre=""
            # betas are regular releases (HACS offers them without "show beta versions"); only alphas are pre-releases
            case "$tag" in *-alpha*) pre="--prerelease" ;; esac
            gh release create "$tag" $pre --title "$tag" --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed."
          fi
          # the bare card (manual install without the integration): one self-contained file, not the entry with chunks
          gh release upload "$tag" floorplan_card.zip house_rules.zip dist/single/floorplan-card.js --clobber
