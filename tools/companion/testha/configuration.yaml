# Isolated test Home Assistant for the companion tests (tools/companion/testha/start.sh). Deliberately without light,
# scene, tts and notify integrations: fp_fake registers those services and records the calls.
homeassistant:
  name: Grundriss Test
  latitude: 52.52
  longitude: 13.40
  elevation: 30
  unit_system: metric
  time_zone: Europe/Berlin
  country: DE
  language: de
  currency: EUR
frontend:
config:
http:
history:
zone:
  - name: Arbeit
    latitude: 52.50
    longitude: 13.30
    radius: 200
fp_fake:
logger:
  default: warning
